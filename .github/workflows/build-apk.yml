name: Build City Moon 3D APK

on:
  workflow_dispatch:
  push:
    branches: [main, fix/android-webview-startup-apk, feat/save-memory-persistence]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'city-moon-3d-v3.zip'
      - 'city-moon-3d-project-upgraded.zip'
      - 'public/**'
      - 'android/**'
      - 'tools/test-source.mjs'
      - 'tools/test-persistence.mjs'
      - 'PLAN.md'
      - 'assets/**'

permissions:
  contents: read

concurrency:
  group: city-moon-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select project source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f public/index.html ]]; then
            echo "Using project files at repository root."
          elif [[ -f city-moon-3d-v3.zip ]]; then
            rm -rf .city-moon-v3
            mkdir -p .city-moon-v3
            unzip -oq city-moon-3d-v3.zip -d .city-moon-v3
            if [[ -f .city-moon-v3/game/public/index.html ]]; then
              cp -a .city-moon-v3/game/. "$GITHUB_WORKSPACE/"
              echo "Imported the v3 game from game/."
            elif [[ -f .city-moon-v3/public/index.html ]]; then
              cp -a .city-moon-v3/. "$GITHUB_WORKSPACE/"
              echo "Imported the v3 game from the ZIP root."
            else
              echo "::error::city-moon-3d-v3.zip does not contain a supported public/ layout."
              find .city-moon-v3 -maxdepth 4 -type f | head -100
              exit 1
            fi
          elif [[ -f city-moon-3d-project-upgraded.zip ]]; then
            unzip -oq city-moon-3d-project-upgraded.zip -d "$GITHUB_WORKSPACE"
            echo "Extracted the upgraded project into the runner workspace."
          else
            echo "::error::Missing upgraded source. Upload city-moon-3d-v3.zip or city-moon-3d-project-upgraded.zip to the repository root, or import public/."
            exit 1
          fi

      - name: Create Android WebView wrapper when source only contains public/
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f android/settings.gradle.kts && -f android/app/src/main/AndroidManifest.xml ]]; then
            echo "Using Android wrapper supplied by the source package."
            exit 0
          fi
          echo "Creating the supported minimal Android WebView wrapper."
          rm -rf android
          mkdir -p android/app/src/main/java/com/citymoon/game
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/assets

          cat > android/settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "CityMoon3D"
          include(":app")
          EOF

          cat > android/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.6.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > android/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.citymoon.game"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.citymoon.game"
                  minSdk = 23
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildTypes {
                  release { isMinifyEnabled = false }
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.webkit:webkit:1.11.0")
          }
          EOF

          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">City Moon 3D</string></resources>
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:theme="@style/AppTheme" android:label="@string/app_name" android:icon="@drawable/ic_city_moon_logo" android:usesCleartextTraffic="true" android:hardwareAccelerated="true">
                  <activity android:name=".MainActivity" android:screenOrientation="landscape" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#ffffff</item>
              </style>
          </resources>
          EOF

          cat > android/app/src/main/res/drawable/ic_city_moon_logo.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="512" android:viewportHeight="512">
              <path android:fillColor="#10152f" android:pathData="M0,0h512v512h-512z"/>
              <path android:fillColor="#7de7ff" android:fillAlpha="0.25" android:pathData="M354,65a73,73 0,1 0,76 112a65,65 0,0 1,-76 -112z"/>
              <path android:fillColor="#eafaff" android:pathData="M354,65a73,73 0,1 0,76 112a65,65 0,0 1,-76 -112z"/>
              <path android:fillColor="#202f58" android:pathData="M25,340h70v-88h35v88h24v-120h48v120h28v-66h42v66h25v-93h42v93h30v-55h42v55h61v145h-447z"/>
              <path android:fillColor="#7de7ff" android:pathData="M52,365h9v15h-9z M78,365h9v15h-9z M177,246h10v15h-10z M197,246h10v15h-10z M304,271h9v14h-9z M324,271h9v14h-9z M407,316h9v14h-9z"/>
          </vector>
          EOF

          cat > android/app/src/main/java/com/citymoon/game/MainActivity.kt <<'EOF'
          package com.citymoon.game

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.graphics.Color
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.webkit.WebViewAssetLoader

          class MainActivity : Activity() {
              private lateinit var webView: WebView
              private lateinit var splash: View
              private val handler = Handler(Looper.getMainLooper())
              private var splashDismissed = false

              private fun dismissSplash() {
                  if (splashDismissed) return
                  splashDismissed = true
                  splash.animate().alpha(0f).setDuration(300).withEndAction {
                      (splash.parent as? android.view.ViewGroup)?.removeView(splash)
                  }.start()
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  window.statusBarColor = Color.rgb(9, 13, 31)
                  window.navigationBarColor = Color.rgb(9, 13, 31)
                  window.decorView.systemUiVisibility = (
                      View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  )

                  val assetLoader = WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this))
                      .build()

                  webView = WebView(this).apply {
                      setBackgroundColor(Color.rgb(9, 13, 31))
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.mediaPlaybackRequiresUserGesture = false
                      settings.cacheMode = WebSettings.LOAD_DEFAULT
                      settings.allowFileAccess = false
                      settings.allowContentAccess = false
                      webChromeClient = WebChromeClient()
                      webViewClient = object : WebViewClient() {
                          override fun shouldInterceptRequest(view: WebView, request: WebResourceRequest): WebResourceResponse? {
                              return assetLoader.shouldInterceptRequest(request.url)
                          }
                          override fun onPageFinished(view: WebView, url: String) {
                              super.onPageFinished(view, url)
                              handler.postDelayed({ dismissSplash() }, 700)
                          }
                      }
                  }

                  val root = FrameLayout(this)
                  root.addView(webView, FrameLayout.LayoutParams(-1, -1))
                  val splashLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(32, 24, 32, 24)
                      setBackgroundColor(Color.rgb(9, 13, 31))
                  }
                  val logo = ImageView(this).apply {
                      setImageResource(R.drawable.ic_city_moon_logo)
                      scaleType = ImageView.ScaleType.FIT_CENTER
                  }
                  splashLayout.addView(logo, LinearLayout.LayoutParams(176, 176))
                  val title = TextView(this).apply {
                      text = "THE CITY THAT FORGOT THE MOON"
                      setTextColor(Color.rgb(235, 249, 255))
                      textSize = 19f
                      gravity = Gravity.CENTER
                      letterSpacing = 0.08f
                      setPadding(0, 22, 0, 8)
                  }
                  splashLayout.addView(title, LinearLayout.LayoutParams(-1, -2))
                  val subtitle = TextView(this).apply {
                      text = "Preparing the city..."
                      setTextColor(Color.rgb(125, 231, 255))
                      textSize = 14f
                      gravity = Gravity.CENTER
                  }
                  splashLayout.addView(subtitle, LinearLayout.LayoutParams(-1, -2))
                  splash = splashLayout
                  root.addView(splash, FrameLayout.LayoutParams(-1, -1))
                  setContentView(root)

                  // Keep a fallback in case the page fails before onPageFinished.
                  handler.postDelayed({ dismissSplash() }, 20000)
                  webView.loadUrl("https://appassets.androidplatform.net/assets/www/index.html")
              }

              override fun onBackPressed() {
                  if (::webView.isInitialized && webView.canGoBack()) webView.goBack()
                  else super.onBackPressed()
              }

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  if (::webView.isInitialized) webView.destroy()
                  super.onDestroy()
              }
          }
          EOF

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JavaScript and offline assets
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f android/app/src/main/java/com/citymoon/game/MainActivity.kt
          shopt -s nullglob
          js_files=(public/src/*.js)
          if (( ${#js_files[@]} == 0 )); then
            echo "::error::No JavaScript source files found under public/src/."
            exit 1
          fi
          for file in "${js_files[@]}"; do
            node --experimental-default-type=module --check "$file"
          done
          if [[ -f tools/test-source.mjs ]]; then
            node --check tools/test-source.mjs
            node tools/test-source.mjs
          else
            echo "tools/test-source.mjs not present in this v3 source package; skipping optional helper test."
          fi
          if [[ -f tools/test-persistence.mjs ]]; then
            node --experimental-default-type=module tools/test-persistence.mjs
          else
            echo "::error::Persistence regression tests are required but missing."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Package the actual Three.js game for offline WebView
        shell: bash
        run: |
          set -euo pipefail
          test -f public/vendor/three.module.js
          test -f public/vendor/addons/loaders/GLTFLoader.js
          test -f public/assets/characters/character-male-a.glb
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -R public/. android/app/src/main/assets/www/
          if [[ -f assets/logo.svg ]]; then
            cp assets/logo.svg android/app/src/main/assets/www/logo.svg
          fi
          test -f android/app/src/main/assets/www/index.html
          test -f android/app/src/main/assets/www/src/main.js
          test -f android/app/src/main/assets/www/assets/characters/character-male-a.glb

      - name: Build debug APK
        run: gradle -p android --no-daemon clean assembleDebug

      - name: Verify APK exists and is non-empty
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: city-moon-3d-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
