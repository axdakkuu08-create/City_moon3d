name: Build City Moon 3D APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'city-moon-3d-v3.zip'
      - 'city-moon-3d-project-upgraded.zip'
      - 'public/**'
      - 'android/**'
      - 'tools/test-source.mjs'
      - 'PLAN.md'

permissions:
  contents: read

concurrency:
  group: city-moon-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select project source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f public/index.html && -f android/settings.gradle.kts ]]; then
            echo "Using project files at repository root."
          elif [[ -f city-moon-3d-v3.zip ]]; then
            rm -rf .city-moon-v3
            mkdir -p .city-moon-v3
            unzip -oq city-moon-3d-v3.zip -d .city-moon-v3
            if [[ -f .city-moon-v3/game/public/index.html && -f .city-moon-v3/game/android/settings.gradle.kts ]]; then
              cp -a .city-moon-v3/game/. "$GITHUB_WORKSPACE/"
              echo "Imported the v3 game from game/ into the runner project root."
            elif [[ -f .city-moon-v3/public/index.html && -f .city-moon-v3/android/settings.gradle.kts ]]; then
              cp -a .city-moon-v3/. "$GITHUB_WORKSPACE/"
              echo "Imported the v3 game from the ZIP root."
            else
              echo "::error::city-moon-3d-v3.zip does not contain a supported public/ and android/ project layout."
              find .city-moon-v3 -maxdepth 3 -type f | head -100
              exit 1
            fi
          elif [[ -f city-moon-3d-project-upgraded.zip ]]; then
            unzip -oq city-moon-3d-project-upgraded.zip -d "$GITHUB_WORKSPACE"
            echo "Extracted the upgraded project into the runner workspace."
          else
            echo "::error::Missing upgraded source. Upload city-moon-3d-v3.zip or city-moon-3d-project-upgraded.zip to the repository root, or import public/ and android/."
            exit 1
          fi
          if [[ ! -f public/index.html || ! -f android/settings.gradle.kts ]]; then
            echo "::error::The selected source must contain public/ and android/ at the project root."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JavaScript and offline assets
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f android/app/src/main/java/com/citymoon/game/MainActivity.kt
          for file in public/src/*.js tools/test-source.mjs; do
            node --check "$file"
          done
          node tools/test-source.mjs

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Package the actual Three.js game for offline WebView
        shell: bash
        run: |
          set -euo pipefail
          test -f public/vendor/three.module.js
          test -f public/vendor/addons/loaders/GLTFLoader.js
          test -f public/assets/characters/character-male-a.glb
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -R public/. android/app/src/main/assets/www/
          test -f android/app/src/main/assets/www/index.html
          test -f android/app/src/main.js
          test -f android/app/src/main/assets/www/src/main.js
          test -f android/app/src/main/assets/www/assets/characters/character-male-a.glb

      - name: Build debug APK
        run: gradle -p android --no-daemon clean assembleDebug

      - name: Verify APK exists and is non-empty
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: city-moon-3d-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
