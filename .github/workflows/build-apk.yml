name: Build City Moon 3D APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'city-moon-3d-project-upgraded.zip'
      - 'public/**'
      - 'android/**'
      - 'tools/test-source.mjs'
      - 'PLAN.md'

permissions:
  contents: read

concurrency:
  group: city-moon-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select project source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f public/index.html && -f android/settings.gradle.kts ]]; then
            echo "PROJECT_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            echo "Using project files at repository root."
          elif [[ -f city-moon-3d-project-upgraded.zip ]]; then
            PROJECT_ROOT="$GITHUB_WORKSPACE/.citymoon-project"
            rm -rf "$PROJECT_ROOT"
            mkdir -p "$PROJECT_ROOT"
            unzip -q city-moon-3d-project-upgraded.zip -d "$PROJECT_ROOT"
            if [[ ! -f "$PROJECT_ROOT/public/index.html" || ! -f "$PROJECT_ROOT/android/settings.gradle.kts" ]]; then
              echo "::error::The uploaded ZIP does not contain public/ and android/ at its root."
              exit 1
            fi
            echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
            echo "Using the upgraded project extracted from the repository ZIP."
          else
            echo "::error::Missing upgraded source. Upload city-moon-3d-project-upgraded.zip to the repository root, or import its public/ and android/ folders."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JavaScript and offline assets
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          test -f public/index.html
          test -f android/app/src/main/java/com/citymoon/game/MainActivity.kt
          for file in public/src/*.js tools/test-source.mjs; do
            node --check "$file"
          done
          node tools/test-source.mjs

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Package the actual Three.js game for offline WebView
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          test -f public/vendor/three.module.js
          test -f public/vendor/addons/loaders/GLTFLoader.js
          test -f public/assets/characters/character-male-a.glb
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -R public/. android/app/src/main/assets/www/
          test -f android/app/src/main/assets/www/index.html
          test -f android/app/src/main/assets/www/src/main.js
          test -f android/app/src/main/assets/www/assets/characters/character-male-a.glb

      - name: Build debug APK
        run: gradle -p "$PROJECT_ROOT/android" --no-daemon clean assembleDebug

      - name: Verify APK exists and is non-empty
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_ROOT/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: city-moon-3d-debug-apk
          path: ${{ env.PROJECT_ROOT }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
