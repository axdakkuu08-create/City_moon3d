name: Extract v3 source snapshot

on:
  push:
    branches:
      - opt/startup-performance

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[extract-source]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract v3 source into repository workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .city-moon-v3 .extracted-source
          mkdir -p .city-moon-v3 .extracted-source
          unzip -q city-moon-3d-v3.zip -d .city-moon-v3
          if [ -f .city-moon-v3/game/public/index.html ]; then
            cp -a .city-moon-v3/game/. .extracted-source/
          elif [ -f .city-moon-v3/public/index.html ]; then
            cp -a .city-moon-v3/. .extracted-source/
          else
            echo 'Could not locate v3 public/index.html after extraction.' >&2
            find .city-moon-v3 -maxdepth 4 -type f | head -100
            exit 1
          fi
          rm -rf public android tools
          cp -a .extracted-source/. .
          rm -rf .city-moon-v3 .extracted-source

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No extracted source changes to commit.'
            exit 0
          fi
          git commit -m 'chore: materialize v3 source [extract-source]'
          git push origin HEAD:opt/startup-performance
