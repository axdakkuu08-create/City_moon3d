name: Run world startup patch
on:
  workflow_dispatch:
  push:
    branches: [opt/startup-performance]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[world-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/patch-world.mjs
      - run: |
          for f in public/src/*.js; do node --check "$f"; done
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/src/world.js tools/patch-world.mjs
          git commit -m 'perf: optimize world startup [world-patch]'
          git push origin HEAD:opt/startup-performance
